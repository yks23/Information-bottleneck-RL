seed: 0
run_name: tictactoe_rollout32
output_dir: runs
device: cuda

wandb:
  project: information-bottleneck-alphazero
  mode: offline

env:
  name: tictactoe

model:
  hidden_size: 128
  num_blocks: 3

mcts:
  num_rollouts: 32
  c_puct: 1.5
  temperature: 1.0

training:
  steps: 1000
  episodes_per_step: 8
  batch_size: 128
  replay_capacity: 100000
  learning_rate: 0.0005
  eval_interval: 25
  checkpoint_interval: 100
  keep_last_checkpoints: 3

reward:
  correctness_weight: 1.0
  format_weight: 0.1
  noise_c: 0.0

self_play:
  shared_params: true
  opponent_update_interval: 100
